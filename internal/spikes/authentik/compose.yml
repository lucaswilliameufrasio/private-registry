services:
  postgresql:
    image: postgres:18.6-alpine3.23@sha256:8c80c49c67052d82f9aaf4ee1f1881c8926b445a1cc916892934845eb8c24204
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_TEST_POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 2s
      timeout: 2s
      retries: 30
    cpus: 0.75
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    networks:
      - backend

  valkey:
    image: valkey/valkey:9.0.3-alpine@sha256:e1095c6c76ee982cb2d1e07edbb7fb2a53606630a1d810d5a47c9f646b708bf5
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    cpus: 0.25
    mem_limit: 192m
    pids_limit: 64
    restart: unless-stopped
    networks:
      - backend

  server:
    image: ghcr.io/goauthentik/server@sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849
    command: ["server"]
    environment: &authentik-environment
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_TEST_POSTGRES_PASSWORD:?required}
      AUTHENTIK_REDIS__HOST: valkey
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_TEST_SECRET_KEY:?required}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_TEST_BOOTSTRAP_TOKEN:?required}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_TEST_BOOTSTRAP_PASSWORD:?required}
      PRIVATE_REGISTRY_SCIM_FIXTURE_TOKEN: ${PRIVATE_REGISTRY_SCIM_FIXTURE_TOKEN:?required}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    depends_on:
      postgresql:
        condition: service_healthy
      valkey:
        condition: service_started
    cpus: 1.5
    mem_limit: 1g
    pids_limit: 256
    restart: unless-stopped
    networks:
      - backend

  worker:
    image: ghcr.io/goauthentik/server@sha256:ab9b4e8cc4ab3f8d1198d2db6aeea66bafea1963b3f2843589e0d163f97d9849
    command: ["worker"]
    environment: *authentik-environment
    depends_on:
      postgresql:
        condition: service_healthy
      valkey:
        condition: service_started
    cpus: 1
    mem_limit: 768m
    pids_limit: 256
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    internal: true
