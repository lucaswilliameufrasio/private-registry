# Fast checks on every push and pull request. The integration suites need
# local fixtures (PostgreSQL, Floci, OCI tools, Authentik, Mailpit, language
# toolchains) and run with `make verify` outside CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build (linux/amd64 and linux/arm64, no CGO)
        run: make build build-arm64
      - name: Format
        run: make format-check
      - name: Vet
        run: |
          go vet ./...
          go vet -tags=integration ./...
      - name: Unit tests with the race detector
        run: go test -race -count=1 ./...
